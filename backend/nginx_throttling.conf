# Nginx конфигурация для throttling на уровне edge
# Добавить в основной nginx.conf или включить как отдельный файл

# Зона для ограничения запросов к API
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
    # ... остальные настройки сервера ...
    
    # API endpoints с throttling
    location /api/ {
        # Ограничение: 5 запросов/секунду с burst до 20
        limit_req zone=api burst=20 nodelay;
        
        # Пробрасывание заголовков для правильной идентификации клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;  # КРИТИЧНО для HTTPS редиректов
        
        # Пробрасывание к Django
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
        
        # Таймауты (увеличены для стабильности)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;  # Увеличено для "тяжёлых" страниц
    }
    
    # Статические файлы без ограничений
    location /static/ {
        alias /path/to/static/files/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Медиа файлы без ограничений
    location /media/ {
        alias /path/to/media/files/;
        expires 1M;
        add_header Cache-Control "public";
    }
}

# Дополнительные зоны для разных типов запросов (опционально)
limit_req_zone $binary_remote_addr zone=heavy:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=light:10m rate=10r/s;

